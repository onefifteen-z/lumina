name: "Feature request"
description: "Suggest a new capability or improvement for Lumina."
title: "[feat] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Lumina is local-first. Please make sure your idea is compatible with:
        - **Privacy** — nothing should phone home or leak vault contents.
        - **Vault portability** — data stays as plain Markdown / standard files.
        - **Performance** — cold-load and search must stay snappy on large vaults.

  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What are you trying to do? What's painful today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work from the user's perspective?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why you rejected them.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This change preserves local-first behavior (no cloud calls).
          required: true
        - label: This change keeps the vault as portable Markdown / standard files.
          required: true
        - label: I'm willing to help test or implement this.
          required: false
