<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Lumina Loading</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #111113;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, sans-serif;
  }

  .scene {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }

  /* ── Fox container ── */
  .fox-wrap {
    position: relative;
    width: 80px;
    height: 80px;
  }

  .fox-svg {
    width: 80px;
    height: 80px;
    animation: breathe 2.8s ease-in-out infinite;
    transform-origin: center bottom;
  }

  /* Subtle scale breathe */
  @keyframes breathe {
    0%,100% { transform: scaleY(1) scaleX(1); }
    45%      { transform: scaleY(1.03) scaleX(0.98); }
  }

  /* Ears wiggle */
  .ear-left {
    transform-origin: 248px 254px;
    animation: ear-l 3.4s ease-in-out infinite;
  }
  .ear-right {
    transform-origin: 432px 254px;
    animation: ear-r 3.4s ease-in-out infinite;
  }
  @keyframes ear-l {
    0%,60%,100% { transform: rotate(0deg); }
    20%          { transform: rotate(-5deg); }
    40%          { transform: rotate(3deg); }
  }
  @keyframes ear-r {
    0%,60%,100% { transform: rotate(0deg); }
    20%          { transform: rotate(5deg); }
    40%          { transform: rotate(-3deg); }
  }

  /* Blink */
  .eye-left, .eye-right {
    animation: blink 4s ease-in-out infinite;
  }
  .eye-right { animation-delay: 0.05s; }
  @keyframes blink {
    0%,88%,96%,100% { transform: scaleY(1); }
    92%              { transform: scaleY(0.08); }
  }
  .eye-left  { transform-origin: 255px 287px; }
  .eye-right { transform-origin: 425px 287px; }

  /* Shine drift */
  .shine-l { animation: shine-drift 2.8s ease-in-out infinite; transform-origin: 257px 274px; }
  .shine-r { animation: shine-drift 2.8s ease-in-out infinite 0.1s; transform-origin: 423px 274px; }
  @keyframes shine-drift {
    0%,100% { transform: translate(0,0); }
    50%      { transform: translate(1px,-1px); }
  }

  /* Facet shimmer — sequenced amber pulses */
  .facet-top    { animation: shimmer 2.6s ease-in-out infinite 0s; }
  .facet-center { animation: shimmer 2.6s ease-in-out infinite 0.3s; }
  .facet-lower  { animation: shimmer 2.6s ease-in-out infinite 0.6s; }
  .facet-muzzle { animation: shimmer 2.6s ease-in-out infinite 0.9s; }

  @keyframes shimmer {
    0%,100% { opacity: 1; }
    50%      { opacity: 0.78; }
  }

  /* Tail glow pulse underneath fox */
  .glow-ring {
    position: absolute;
    bottom: -6px;
    left: 50%;
    transform: translateX(-50%);
    width: 52px;
    height: 10px;
    border-radius: 50%;
    background: #D4731A;
    filter: blur(8px);
    animation: glow-pulse 2.8s ease-in-out infinite;
    opacity: 0.5;
  }
  @keyframes glow-pulse {
    0%,100% { opacity: 0.35; transform: translateX(-50%) scaleX(0.85); }
    45%      { opacity: 0.6;  transform: translateX(-50%) scaleX(1.1); }
  }

  /* ── Thinking dots ── */
  .dots {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #D4731A;
    animation: dot-wave 1.4s ease-in-out infinite;
    opacity: 0.7;
  }
  .dot:nth-child(2) { animation-delay: 0.18s; }
  .dot:nth-child(3) { animation-delay: 0.36s; }
  @keyframes dot-wave {
    0%,80%,100% { transform: translateY(0);   opacity: 0.45; }
    40%          { transform: translateY(-5px); opacity: 1; }
  }

  /* ── Label ── */
  .label {
    font-size: 11px;
    letter-spacing: 0.12em;
    color: #6E6E73;
    text-transform: uppercase;
    animation: label-fade 2.8s ease-in-out infinite;
  }
  @keyframes label-fade {
    0%,100% { opacity: 0.5; }
    50%      { opacity: 0.85; }
  }

  /* ─── Demo: show two states ─── */
  .demo-row {
    display: flex;
    gap: 60px;
    align-items: flex-end;
  }
  .demo-card {
    background: #1C1C1E;
    border-radius: 20px;
    padding: 32px 36px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    border: 1px solid #2A2A2E;
  }
  .demo-label {
    font-size: 10px;
    letter-spacing: 0.14em;
    color: #3A3A3F;
    text-transform: uppercase;
    margin-top: 4px;
  }

  /* Small variant */
  .fox-wrap.sm { width: 44px; height: 44px; }
  .fox-wrap.sm .fox-svg { width: 44px; height: 44px; }
  .fox-wrap.sm .glow-ring { width: 30px; height: 7px; }
</style>
</head>
<body>

<div class="demo-row">

  <!-- LARGE variant -->
  <div class="demo-card">
    <div class="fox-wrap">
      <div class="glow-ring"></div>
      <svg class="fox-svg" viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg">

        <!-- HEAD BASE -->
        <polygon class="facet-top" points="216,156 340,172 464,156 490,320 432,462 340,486 248,462 190,320" fill="#D4731A"/>

        <!-- FOREHEAD -->
        <polygon class="facet-top ear-left" points="216,156 248,254 294,244 340,172" fill="#EFA03C"/>
        <polygon class="facet-top ear-right" points="464,156 432,254 386,244 340,172" fill="#EFA03C"/>
        <polygon class="facet-top" points="248,254 432,254 386,244 340,172 294,244" fill="#EFA03C"/>

        <!-- EAR INNERS -->
        <polygon class="ear-left" points="224,164 252,248 294,244" fill="#F2C898"/>
        <polygon class="ear-right" points="456,164 428,248 386,244" fill="#F2C898"/>

        <!-- GOLDEN SLIVER -->
        <polygon class="facet-top" points="324,172 356,172 350,252 340,282 330,252" fill="#F8CA52" fill-opacity="0.52"/>

        <!-- DARK MASKS -->
        <polygon points="190,320 248,254 292,312 266,428 248,462" fill="#180A02"/>
        <polygon points="490,320 432,254 388,312 414,428 432,462" fill="#180A02"/>

        <!-- CENTER FACE -->
        <polygon class="facet-center" points="248,254 432,254 388,312 292,312" fill="#EFA03C"/>

        <!-- LOWER CENTER -->
        <polygon class="facet-lower" points="292,312 388,312 398,384 282,384" fill="#E09030"/>

        <!-- MUZZLE -->
        <polygon class="facet-muzzle" points="282,384 398,384 408,452 340,474 272,452" fill="#F2E0C6"/>

        <!-- EYES -->
        <g class="eye-left">
          <polygon points="248,254 292,278 254,300 218,278" fill="#0E0502"/>
        </g>
        <g class="eye-right">
          <polygon points="432,254 388,278 426,300 462,278" fill="#0E0502"/>
        </g>

        <!-- EYE SHINES -->
        <g class="shine-l">
          <circle cx="257" cy="274" r="7" fill="#FFFFFF" fill-opacity="0.88"/>
          <circle cx="254" cy="271" r="2.5" fill="#FFFFFF"/>
        </g>
        <g class="shine-r">
          <circle cx="423" cy="274" r="7" fill="#FFFFFF" fill-opacity="0.88"/>
          <circle cx="420" cy="271" r="2.5" fill="#FFFFFF"/>
        </g>

        <!-- NOSE -->
        <ellipse cx="340" cy="416" rx="12" ry="8" fill="#140804"/>
        <ellipse cx="337" cy="413" rx="4" ry="2.8" fill="#FFFFFF" fill-opacity="0.28"/>

      </svg>
    </div>

    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
    <div class="label">Thinking</div>
    <div class="demo-label">Large</div>
  </div>

  <!-- SMALL variant -->
  <div class="demo-card">
    <div class="fox-wrap sm">
      <div class="glow-ring"></div>
      <svg class="fox-svg" viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg">
        <polygon points="216,156 340,172 464,156 490,320 432,462 340,486 248,462 190,320" fill="#D4731A"/>
        <polygon class="ear-left" points="216,156 248,254 294,244 340,172" fill="#EFA03C"/>
        <polygon class="ear-right" points="464,156 432,254 386,244 340,172" fill="#EFA03C"/>
        <polygon points="248,254 432,254 386,244 340,172 294,244" fill="#EFA03C"/>
        <polygon class="ear-left" points="224,164 252,248 294,244" fill="#F2C898"/>
        <polygon class="ear-right" points="456,164 428,248 386,244" fill="#F2C898"/>
        <polygon points="190,320 248,254 292,312 266,428 248,462" fill="#180A02"/>
        <polygon points="490,320 432,254 388,312 414,428 432,462" fill="#180A02"/>
        <polygon points="248,254 432,254 388,312 292,312" fill="#EFA03C"/>
        <polygon points="292,312 388,312 398,384 282,384" fill="#E09030"/>
        <polygon points="282,384 398,384 408,452 340,474 272,452" fill="#F2E0C6"/>
        <g class="eye-left">
          <polygon points="248,254 292,278 254,300 218,278" fill="#0E0502"/>
        </g>
        <g class="eye-right">
          <polygon points="432,254 388,278 426,300 462,278" fill="#0E0502"/>
        </g>
        <circle cx="257" cy="274" r="7" fill="#FFFFFF" fill-opacity="0.88"/>
        <circle cx="423" cy="274" r="7" fill="#FFFFFF" fill-opacity="0.88"/>
        <ellipse cx="340" cy="416" rx="12" ry="8" fill="#140804"/>
      </svg>
    </div>

    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
    <div class="demo-label">Small</div>
  </div>

</div>

</body>
</html>
